<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Portfolio temporarily unavailable</title>
    <style>
      :root { color-scheme: light; font-family: Arial, Helvetica, sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f7f2e8; color: #0b0c0c; }
      main { width: min(100%, 680px); padding: clamp(32px, 7vw, 72px); background: #fff; border: 3px solid #0b0c0c; box-shadow: 8px 10px 0 #8acbbb; }
      p { margin: 0 0 18px; font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(40px, 8vw, 76px); line-height: .95; letter-spacing: -.055em; text-transform: uppercase; }
      small { display: block; margin-top: 30px; font-size: 15px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <p>Temporary notice</p>
      <h1>Portfolio temporarily unavailable.</h1>
      <small>Legal and privacy information is currently being reviewed.</small>
    </main>
  </body>
</html>
